    <link href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var ignoredPattern = 'A listener indicated an asynchronous response by returning true';

        function messageFrom(value) {
          if (!value) return '';
          if (typeof value === 'string') return value;
          if (value.message) return String(value.message);

          try {
            return JSON.stringify(value);
          } catch (error) {
            return String(value);
          }
        }

        function suppressIfBrowserNoise(event, value) {
          if (messageFrom(value).indexOf(ignoredPattern) === -1) return;
          event.preventDefault();
          event.stopImmediatePropagation();
        }

        window.addEventListener('unhandledrejection', function (event) {
          suppressIfBrowserNoise(event, event.reason);
        }, true);
        window.addEventListener('error', function (event) {
          suppressIfBrowserNoise(event, event.error || event.message);
        }, true);
      }());
    </script>
    <title>SaTourN Datenqualitätsmonitor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
